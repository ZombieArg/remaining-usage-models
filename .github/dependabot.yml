# Grouped and monthly on purpose. This is a spare-time project, and a weekly
# per-dependency stream of pull requests is the most reliable way to abandon
# one. Security advisories are delivered separately by Dependabot alerts and
# are not affected by this schedule. Major bumps still arrive on their own,
# because they are the ones that deserve a look.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - '*'
